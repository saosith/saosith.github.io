# Pages CMS configuration — https://pagescms.org
#
# Sign in at app.pagescms.org with GitHub, pick this repository, and this file
# describes the editing forms. Saving commits to `main`, which triggers the
# deploy workflow, so the public site updates a minute or two later.
#
# The home page is one long scroll, so each of its sections gets its own file
# under src/data and its own entry in the sidebar below, listed in the order the
# sections appear on the page. Editing Experience therefore cannot rewrite
# Education, and no single form is longer than the section it edits.
#
# Body fields are plain `text`, not `rich-text`, on purpose. Project bodies are
# MDX containing component calls such as <BodeFigure … />, and notes contain
# fenced SPICE and shell blocks; a rich-text editor would re-serialise both and
# could mangle them. Frontmatter is where this config earns its keep — spec
# tables, headline numbers, tags and the provenance badge become real forms.
#
# Note for `select` fields: Pages CMS expects the choices under `options.values`.
# A bare list directly under `options` silently yields "No options found".

media:
  input: public/uploads
  output: /uploads
  # Without `categories` the picker rejects anything that is not an image,
  # which is what blocked uploading a resume.
  categories: [image, document]

content:
  # ----------------------------------------------------------------- now
  # Lives at the top of the sidebar because it is the one entry meant to be
  # edited often. Static on purpose — see the note in NowLine.astro.
  - name: now
    label: Now — what you're working on
    type: file
    path: src/data/now.json
    format: json
    fields:
      - name: show
        label: Show the Now line
        type: boolean
        default: true
        description: Untick to hide it from the home page without deleting what you wrote.
      - name: status
        label: What you're working on
        type: text
        description: One sentence, present tense. Name the actual thing — "sizing a two-stage Miller op-amp in sky130" beats "working on analog design".
      - name: updated
        label: Last updated
        type: date
        description: Shown under the line. Change it whenever you change the sentence — a date that stops moving tells a reader the line went stale.
      - name: href
        label: Link (optional)
        type: string
        description: Point at the project page or repo if there is one to point at. Leave blank for no link.
      - name: hrefLabel
        label: Link text
        type: string
        description: Leave blank for "Read more".

  # ------------------------------------------------------------ 01  about
  - name: about
    label: 01 · About
    type: file
    path: src/data/about.json
    format: json
    fields:
      - name: paragraphs
        label: Paragraphs
        type: string
        list: true
        description: One entry per paragraph, in the order they should read.
      - name: photo
        label: Profile photo
        type: image
        description: Square, like a LinkedIn profile picture — it is displayed 1:1, so a portrait or landscape crop will be cut off. Leave empty and the slot shows a placeholder.
      - name: photoAlt
        label: Photo description
        type: string
        description: For screen readers and for when the image fails to load. Leave blank to use your name and role.

  # ------------------------------------------------------- 02  experience
  - name: experience
    label: 02 · Experience
    type: file
    path: src/data/experience.json
    format: json
    fields:
      - name: entries
        label: Roles
        type: object
        list: true
        description: Newest first. Every entry needs a date and something a reader can open.
        fields:
          - { name: date, label: Date, type: string, required: true }
          - { name: title, label: Role, type: string, required: true }
          - { name: org, label: Organisation, type: string }
          - name: logo
            label: Organisation logo
            type: image
            description: Square mark shown beside the entry. Leave it empty and the entry falls back to initials.
          - name: body
            label: Context line
            type: text
            description: 'One short fragment, no "I": what the role is and what it is for, e.g. "Hub board for SCR''s IGVC 2027 robot: power, CAN and E-Stop distribution."'
          - name: bullets
            label: Points (resume style)
            type: string
            list: true
            description: '2 or 3 points, no "I": verb + what + how + result or scale, e.g. "Replaced the Schottky with P-MOSFET protection, cutting calculated loss at 8 A from 3.6 W to 0.7 W." Under about 60 words in total.'
          - name: evidenceLabel
            label: Evidence — label
            type: string
            description: What the reader is about to open, e.g. "Read the Hub write-up" or "Research poster". Say the real thing — do not call an image a PDF.
          - name: evidenceHref
            label: Evidence — link
            type: string
            description: A project page (/projects/...), an external URL, or an uploaded file as /uploads/<filename>. A label with no link renders as "— add the link", so fill both or neither.
          - name: placeholder
            label: Still a placeholder
            type: boolean
            default: false
            description: While ticked, this entry renders with a visible "replace this entry" chip.
          - name: media
            label: Photo, figure or video (right column)
            type: file
            description: Shown beside the entry on wide screens. A lab photo, a poster, a board render, or a short silent MP4 loop (put a .jpg with the same name next to it as the still frame).
          - { name: mediaAlt, label: Photo caption, type: string, description: 'Shown under the photo and read by screen readers, e.g. "Poster: cloud particle size vs altitude".' }
          - name: media2
            label: Second photo (optional)
            type: image
            description: A second image under the first, e.g. a sample photo under a process video.
          - { name: media2Alt, label: Second photo caption, type: string }
          - name: highlights
            label: Highlights (right column)
            type: string
            list: true
            description: Two to four short chips, e.g. "Photolithography". Tools and techniques, not sentences. With no photo and no highlights the column shows an "add" slot.

  # --------------------------------------------------------- 03  projects
  - name: projects
    label: 03 · Projects
    type: collection
    path: src/content/projects
    filename: '{primary}.mdx'
    format: yaml-frontmatter
    view:
      primary: title
      sort: [order, date, title]
      order: asc
      fields: [title, date, dataStatus, featured, draft]
    fields:
      - { name: title, label: Title, type: string, required: true }
      - name: summary
        label: Summary
        type: text
        required: true
        description: One or two sentences. Shows on the projects index and as the page lede.
      - { name: date, label: Date, type: date, required: true }
      - { name: updated, label: Last updated, type: date }
      - name: order
        label: Sort order
        type: number
        default: 100
        description: Lower sorts first on the projects index.
      - { name: featured, label: Show on the home page, type: boolean, default: false }
      - name: draft
        label: Draft
        type: boolean
        default: true
        description: Draft projects are left out of the build entirely.

      - name: dataStatus
        label: Where the numbers come from
        type: select
        default: model
        required: true
        description: Renders a visible badge at the top of the page. Keep this honest.
        options:
          values:
            - { value: design, label: Design only — not simulated or built }
            - { value: model, label: Hand model — not simulated }
            - { value: simulated, label: Simulated (ngspice) }
            - { value: built, label: Built and working, not measured }
            - { value: measured, label: Measured silicon }

      - name: conditions
        label: Test conditions
        type: string
        description: 'e.g. VDD = 1.8 V, T = 27 °C, CL = 2 pF. Shown under every table and plot.'
      - { name: process, label: Process, type: string }
      - name: ip
        label: IP status
        type: text
        description: State plainly whether anything here is restricted.

      - name: cover
        label: Thumbnail
        type: image
        description: Shown beside this project in the list on the home page. A schematic, a layout render or a board photo. Displayed in a 2:1 frame, fitted whole rather than cropped — so trim the whitespace before uploading or the picture reads as blank.
      - name: coverVideo
        label: Card video (optional)
        type: file
        description: A short silent loop (a few seconds, under 1 MB, MP4) shown on the project card instead of the thumbnail. Put a matching .jpg with the same name next to it as the still frame.
      - name: coverAlt
        label: Thumbnail description
        type: string
        description: For screen readers. Leave blank if the thumbnail adds nothing the title does not already say.

      - name: tags
        label: Tags
        type: string
        list: true
        description: Drives the filter chips on the projects index.
      - { name: tools, label: Tools used, type: string, list: true }

      - name: headline
        label: Key parameters
        type: object
        list: true
        description: Three or four numbers. Shown on the index card and in the sidebar.
        fields:
          - { name: label, label: Parameter, type: string, required: true }
          - { name: value, label: Value, type: string, required: true }
          - { name: unit, label: Unit, type: string }

      - name: specs
        label: Electrical characteristics
        type: object
        list: true
        description: The datasheet table. Leave "Measured" empty until there is silicon — the column disappears.
        fields:
          - { name: param, label: Parameter, type: string, required: true }
          - { name: symbol, label: Symbol, type: string }
          - { name: target, label: Target, type: string }
          - { name: sim, label: Simulated, type: string }
          - { name: measured, label: Measured, type: string }
          - { name: unit, label: Unit, type: string }
          - name: status
            label: vs. target
            type: select
            default: na
            options:
              values:
                - { value: pass, label: Meets }
                - { value: marginal, label: Marginal }
                - { value: fail, label: Misses }
                - { value: na, label: Not assessed }
          - { name: note, label: Footnote ref, type: string }

      - name: footnotes
        label: Footnotes
        type: object
        list: true
        fields:
          - { name: ref, label: Ref, type: string, required: true }
          - { name: text, label: Text, type: text, required: true }

      - name: links
        label: Files and links
        type: object
        list: true
        fields:
          - { name: label, label: Label, type: string, required: true }
          - { name: href, label: URL or path, type: string, required: true }

      # ---- report fields: all optional; a short project page needs none ----
      - name: revision
        label: Revision
        type: string
        description: 'e.g. "Rev A — schematic" or "Rev B — built and tested". Shown in the header and on the PDF title block. Bump it when the design changes, and add a row to Revision history.'
      - name: abstract
        label: Abstract
        type: text
        description: Three to five sentences — the problem, what you built, and the key result (or "not yet built"). Someone who reads only this should know what the project is.
      - name: team
        label: Team project
        type: object
        description: Fill both for team work (e.g. SCR). Leave empty for solo work.
        fields:
          - { name: org, label: Team or organisation, type: string, description: 'e.g. "Sooner Competitive Robotics (IGVC 2027)"' }
          - { name: role, label: Your role, type: string, description: 'Say what you owned, e.g. "Designed the Hub board: schematic, layout, part selection."' }
      - name: dataNote
        label: Badge text (optional)
        type: string
        description: Replaces the stock sentence on the status badge, which is written for sky130 chip work. e.g. "Simulated in LTspice; no board has been built."
      - name: pdf
        label: Report PDF (optional)
        type: file
        description: Usually leave empty — `npm run pdf` writes /uploads/<project>-report.pdf and the page links it automatically. Upload here only to use a different PDF.

      - name: decisions
        label: Design decisions
        type: object
        list: true
        description: Each choice between options, including what was rejected. Shown wherever the write-up has <DecisionTable rows={frontmatter.decisions} />.
        fields:
          - { name: id, label: ID, type: string, description: 'Optional, e.g. "D-003".' }
          - { name: topic, label: Decision, type: string, required: true, description: 'e.g. "3.3 V regulator"' }
          - { name: options, label: Options considered, type: text, required: true, description: 'e.g. "LDO (REG1117), buck (MP2359), buck (AP63301)"' }
          - { name: choice, label: Choice, type: string, required: true }
          - { name: reason, label: Why, type: text, required: true, description: One or two sentences — the deciding trade-off, and why the others lost. }
          - name: status
            label: Status
            type: select
            default: decided
            options:
              values:
                - { value: decided, label: Decided }
                - { value: open, label: Still open }
                - { value: reversed, label: Reversed later }

      - name: stages
        label: Project status
        type: object
        list: true
        description: One row per stage, schematic to bring-up. Shown wherever the write-up has <StatusTable rows={frontmatter.stages} />. Add a full Layout, Simulation or Test section only once it has real content; until then the stage lives here.
        fields:
          - { name: stage, label: Stage, type: string, required: true, description: 'e.g. "Placement and routing"' }
          - name: status
            label: Status
            type: select
            default: planned
            options:
              values:
                - { value: done, label: Complete }
                - { value: next, label: In progress }
                - { value: planned, label: Planned }
          - { name: plan, label: Plan, type: text, description: 'What this stage covers, e.g. "Rail voltages, USB enumeration, UART loop-back"' }

      - name: revisions
        label: Revision history
        type: object
        list: true
        description: One row per revision. Shown automatically near the end of the page.
        fields:
          - { name: rev, label: Rev, type: string, required: true, description: 'e.g. "A"' }
          - { name: date, label: Date, type: string, required: true, description: 'YYYY-MM-DD' }
          - { name: change, label: What changed and why, type: text, required: true }

      - name: references
        label: References
        type: object
        list: true
        description: Datasheets, app notes, standards. Shown automatically as a numbered list.
        fields:
          - { name: label, label: Reference, type: string, required: true, description: 'e.g. "TI MSPM0G3507 datasheet"' }
          - { name: href, label: Link, type: string, description: A URL, or an uploaded file as /uploads/<filename>. }

      - name: bom
        label: Bill of materials
        type: object
        list: true
        description: Shown automatically as the appendix. Leave Source empty until you have a real distributor part number — it shows "TBD".
        fields:
          - { name: ref, label: Designators, type: string, required: true, description: 'e.g. "C1, C2"' }
          - { name: part, label: Part, type: string, required: true }
          - { name: value, label: Value, type: string }
          - { name: pkg, label: Package, type: string }
          - { name: source, label: Source, type: string, description: 'Distributor and part number, e.g. "LCSC C22362630"' }

      - name: body
        label: Write-up (MDX)
        type: text
        description: Plain text on purpose — leave the import lines and the <Figure /> tags intact.

  # ----------------------------------------------------------- 04  awards
  - name: awards
    label: 04 · Awards
    type: file
    path: src/data/awards.json
    format: json
    fields:
      - name: entries
        label: Awards, competitions and tapeouts
        type: object
        list: true
        fields:
          - { name: date, label: Date, type: string, required: true }
          - { name: title, label: Award, type: string, required: true }
          - { name: org, label: Awarded by, type: string }
          - name: logo
            label: Logo
            type: image
            description: Square mark shown beside the entry. Leave it empty and the entry falls back to initials.
          - { name: body, label: What it was for, type: text }
          - name: evidenceLabel
            label: Evidence — label
            type: string
            description: What the reader is about to open, e.g. "Research poster". Say the real thing — do not call an image a PDF.
          - name: evidenceHref
            label: Evidence — link
            type: string
            description: An external URL, or a file you uploaded. For an upload, add it under Media first, then paste its path here as /uploads/<filename>. A label with no link renders as "— add the link", so fill both or neither.
          - { name: placeholder, label: Still a placeholder, type: boolean, default: false }

  # ----------------------------------------------------------- 05  skills
  - name: skills
    label: 05 · Skills
    type: file
    path: src/data/skills.json
    format: json
    fields:
      - name: skills
        label: Tools
        type: object
        list: true
        description: One row per skill. Rows sharing a group name are shown together, in the order the groups first appear.
        fields:
          - name: group
            label: Group
            type: string
            required: true
            description: e.g. "Schematic & simulation". Reuse the same wording to put skills in the same column.
          - { name: skill, label: Skill, type: string, required: true }

  # -------------------------------------------------------- 06  education
  - name: education
    label: 06 · Education
    type: file
    path: src/data/education.json
    format: json
    fields:
      - name: entries
        label: Degrees and diplomas
        type: object
        list: true
        fields:
          - { name: date, label: Date, type: string, required: true }
          - { name: title, label: Qualification, type: string, required: true }
          - { name: org, label: Institution, type: string }
          - name: logo
            label: Institution logo
            type: image
            description: Square mark shown beside the entry. Leave it empty and the entry falls back to initials.
          - { name: body, label: Detail, type: text }
          - name: evidenceLabel
            label: Evidence — label
            type: string
            description: What the reader is about to open, e.g. "Research poster". Say the real thing — do not call an image a PDF.
          - name: evidenceHref
            label: Evidence — link
            type: string
            description: An external URL, or a file you uploaded. For an upload, add it under Media first, then paste its path here as /uploads/<filename>. A label with no link renders as "— add the link", so fill both or neither.
          - { name: placeholder, label: Still a placeholder, type: boolean, default: false }

  # ------------------------------------------ 06b  coursework (in education)
  # Its own file and its own form, but it renders as a subsection of Education
  # rather than a section of its own — see EducationSection.astro.
  - name: courses
    label: 06 · Education → Coursework
    type: file
    path: src/data/courses.json
    format: json
    fields:
      - name: courses
        label: Courses
        type: object
        list: true
        description: Coursework that backs up the work, shown under Education. Code and term are optional. Delete every row and the subsection disappears.
        fields:
          - { name: code, label: Course code, type: string }
          - { name: title, label: Title, type: string, required: true }
          - { name: term, label: Term, type: string }
          - { name: note, label: Note, type: text }

  # ------------------------------------------------- notes (their own pages)
  - name: notes
    label: Notes
    type: collection
    path: src/content/notes
    filename: '{primary}.md'
    format: yaml-frontmatter
    view:
      primary: title
      sort: [date, title]
      order: desc
      fields: [title, date, draft]
    fields:
      - { name: title, label: Title, type: string, required: true }
      - { name: summary, label: Summary, type: text, required: true }
      - { name: date, label: Date, type: date, required: true }
      - { name: tags, label: Tags, type: string, list: true }
      - { name: draft, label: Draft, type: boolean, default: false }
      - name: body
        label: Note
        type: text
        description: Markdown. Plain text so fenced code blocks survive editing untouched.

  # ---------------------------------------------------------------- resume
  - name: resume
    label: Resume
    type: file
    path: src/data/resume.json
    format: json
    fields:
      - name: file
        label: Resume (PDF)
        type: file
        description: The nav button and every other link to your CV follow this one value, so replacing it updates them all at once.
      - name: label
        label: Button label
        type: string
        description: Text on the nav button. Leave blank for "Resume".

  # ---------------------------------------------------------------- footer
  - name: footer
    label: Footer
    type: file
    path: src/data/footer.json
    format: json
    fields:
      - name: note
        label: Footer note
        type: text
        description: The paragraph under "Use" in the footer. Say plainly what is and is not covered by an NDA.

  # ----------------------------------------------------- site-wide values
  - name: site
    label: Site details
    type: file
    path: src/data/site.json
    format: json
    fields:
      - name: brand
        label: Header brand
        type: string
        description: The short label beside the logo, top left. Keep it short so it never wraps. Leave blank to use your name instead.
      - name: name
        label: Your name
        type: string
        required: true
        description: Shown in the header, as the heading on the home page, in the browser tab, and in the copyright line. Use the name you want a recruiter to find you by.
      - { name: role, label: Role, type: string }
      - name: credential
        label: Credential
        type: string
        description: Shown beside your role, e.g. "OU ECE '27". Leave blank to hide it.
      - name: tagline
        label: Tagline
        type: text
        description: Shown under your name on the home page and used as the search-result description.
      - name: location
        label: Location
        type: string
        description: Small line above your name, e.g. "Norman, OK". Leave blank to hide it.
      - name: photo
        label: Photo or video
        type: file
        description: Shown beside the hero text, cropped to 3:2 landscape. A lab, conference or team photo, or a short silent MP4 loop (upload a .jpg with the same name too, as the still frame).
      - name: photoCaption
        label: Photo caption
        type: text
        description: The line under the photo. Say what it shows, where, and when.
      - { name: email, label: Email, type: string }
      - name: phone
        label: Phone
        type: string
        description: Shown in the hero contact row. Leave blank to hide it.
      - { name: github, label: GitHub URL, type: string }
      - { name: linkedin, label: LinkedIn URL, type: string }
      - { name: university, label: University, type: string }
